name: Robot Búsqueda Diaria

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 urllib3

      - name: Buscar ofertas y chollos
        run: python tracker.py

      - name: Guardar resultados en el repositorio
        run: |
          git config --global user.name "RobotChollos"
          git config --global user.email "robot@chollos.com"
          git add historial_precios.json chollos.json || true
          git commit -m "Actualización diaria de ofertas [skip ci]" || exit 0
          git push || true
